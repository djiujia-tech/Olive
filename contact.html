    <div class="m_overlay" id="js-overlay"></div>

    <main class="l_main">
      <section class="section_service">
        <div class="l_container-lg">
          <div class="l_contents">
            <h2 class="top_section_title">連絡フォーム</h2>
            <div class="service-body">
              <p class="contact_line-txt">LINEよりお願いします</p>
              <div class="contact_line-img-wrapper">
                <a
                  href="https://contact.worksmobile.com/p/worksat-invitation?externalCode=a9eb1814-4440-4dca-9854-04e17f97efec"
                >
                  <img
                    src="img/Olive-QR.jpg"
                    alt="LINEのQRコード"
                    class="contact_line-img"
                  />
                </a>
              </div>
              <form class="contact_form-body">
                <div class="contact_form-item">
                  <label class="contact_form-label">氏名・会社名（必須）</label>
                  <input
                    type="text"
                    class="contact_form-input"
                    placeholder="〇〇 〇〇様"
                    required
                  />
                </div>
                <div class="contact_form-item">
                  <label class="contact_form-label">電話番号（必須）</label>
                  <input
                    type="tel"
                    class="contact_form-input"
                    placeholder="ハイフンなし"
                    required
                  />
                </div>
                <div class="contact_form-item">
                  <label class="contact_form-label"
                    >メールアドレス（必須）</label
                  >
                  <input
                    type="email"
                    class="contact_form-input"
                    placeholder="mail@mail.com"
                    required
                  />
                </div>
                <div class="contact_form-item">
                  <label class="contact_form-label"
                    >お問い合わせ内容（必須）</label
                  >
                  <textarea
                    class="contact_form-textarea"
                    placeholder="フリーテキスト"
                    required
                  ></textarea>
                </div>
                <button type="submit" class="contact_form-btn m_btn">
                  送信
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
